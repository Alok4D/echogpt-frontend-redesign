<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EchoGPT Quick Launch</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    h2 {
      font-size: 14px;
      margin: 0;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <h2>EchoGPT Multi-AI</h2>
  </div>
  <p>Your unified browser assistant is active. Open the Side Panel to chat with Claude 3.5 Sonnet, GPT-4o, and DeepSeek while browsing.</p>
  <button class="btn" onclick="window.close()">Open Side Panel (Ctrl+B)</button>
</body>
</html>
