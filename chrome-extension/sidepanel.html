<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoGPT Sidebar</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body class="dark-theme">
  <div class="sidebar-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div>
          <span class="title">EchoGPT</span>
          <span class="subtitle">Multi-AI Sidebar</span>
        </div>
      </div>
      <button id="new-chat-btn" class="btn-new">+ New</button>
    </header>

    <!-- Main Container -->
    <div class="main-body">
      <!-- Chat Content -->
      <div class="chat-container" id="chat-container">
        <div class="welcome-box" id="welcome-box">
          <div class="greeting">Hi, good morning 👋</div>
          <div class="headline">How can I help you?</div>

          <div class="quick-grid">
            <button class="grid-btn" data-prompt="Help me write a concise email response.">
              <span class="icon">✍️</span>
              <span>Write</span>
            </button>
            <button class="grid-btn" data-prompt="Translate the selected text into Spanish.">
              <span class="icon">🌐</span>
              <span>Translate</span>
            </button>
            <button class="grid-btn" data-prompt="Read this webpage and extract key takeaways.">
              <span class="icon">📖</span>
              <span>Read page</span>
            </button>
            <button class="grid-btn" data-prompt="Generate an image prompt for a modern dashboard.">
              <span class="icon">🖼️</span>
              <span>Image</span>
            </button>
            <button class="grid-btn" data-prompt="Compare Claude 3.5 and GPT-4o on this topic.">
              <span class="icon">⚖️</span>
              <span>Compare</span>
            </button>
            <button class="grid-btn" data-prompt="Connect to external data connector.">
              <span class="icon">🔗</span>
              <span>MCP</span>
            </button>
          </div>

          <div class="suggestions-label">Suggested Prompts</div>
          <div class="suggestions-list">
            <button class="sugg-btn">Tell me an interesting fun fact</button>
            <button class="sugg-btn">Explain quantum computing in simple terms</button>
            <button class="sugg-btn">Recommend 5 great sci-fi movies</button>
          </div>
        </div>

        <div class="messages-list" id="messages-list"></div>
      </div>

      <!-- Right Tool Navigation -->
      <nav class="tool-nav">
        <button class="nav-item active" title="Chat">💬</button>
        <button class="nav-item" title="Write">✏️</button>
        <button class="nav-item" title="Read page">📖</button>
        <button class="nav-item" title="Translate">🌐</button>
        <button class="nav-item" title="Image">🎨</button>
        <button class="nav-item" title="Compare">⚖️</button>
        <button class="nav-item" title="MCP">🔗</button>
      </nav>
    </div>

    <!-- Input Footer -->
    <footer class="input-footer">
      <div class="model-bar">
        <select id="model-select" class="model-select">
          <option value="Claude 3.5 Sonnet">Claude 3.5 Sonnet</option>
          <option value="GPT-4o Omnimodel">GPT-4o Omnimodel</option>
          <option value="Gemini 1.5 Pro">Gemini 1.5 Pro</option>
          <option value="DeepSeek R1">DeepSeek R1</option>
        </select>
        <span class="web-active-tag">⚡ Live Web</span>
      </div>

      <div class="input-row">
        <input type="text" id="prompt-input" placeholder="Ask a question..." />
        <button id="send-btn" class="send-btn">➤</button>
      </div>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
